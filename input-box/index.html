<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>input box</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class=" container d-flex justify-content-center mt-5">

        <div style="width: 350px;" class="input-group mb-3  mt-5">

            <input type="text" class="form-control" placeholder=" username" aria-label="Recipient’s username"
                aria-describedby="button-addon2">
            <button class="btn btn-outline-secondary" type="button" id="button">Submite</button>

        </div>

    </div>


    <script>

        const input_name = document.getElementsByTagName("input");
        const button = document.getElementsByTagName("button");

        button[0].addEventListener("click", () => {
            const text = input_name[0].value
            alert(text)
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
