<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = 121;
        let original = num;
        let reverse = 0;

        // while loop
        while (num > 0) {
            let digit = num % 10;
            reverse = reverse * 10 + digit;
            num = Math.floor(num / 10);
        }

        if (original === reverse) {
            console.log("Number is Palindrome");
        } else {
            console.log("Number is Not Palindrome");
        }


        // do while loop
        do {
            let digit = num % 10;
            reverse = reverse * 10 + digit;
            num = Math.floor(num / 10);
        } while (num > 0);

        if (original === reverse) {
            console.log("Number is Palindrome");
        } else {
            console.log("Number is Not Palindrome");
        }

        // for loop

        for (; num > 0; num = Math.floor(num / 10)) {
            let digit = num % 10;
            reverse = reverse * 10 + digit;
        }

        if (original === reverse) {
            console.log("Number is Palindrome");
        } else {
            console.log("Number is Not Palindrome");
        }
    </script>
</body>

</html>
