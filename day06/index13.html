<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = 1234;
        let sum = 0;

        // while loop 
        while (num > 0) {
            let digit = num % 10;
            sum = sum + digit;
            num = Math.floor(num / 10);
        }

        console.log("Sum of digits:", sum);

        //do while loop
        do {
            let digit = num % 10;
            sum = sum + digit;
            num = Math.floor(num / 10);
        } while (num > 0);

        console.log("Sum of digits:", sum);

        // for loop
        for (; num > 0; num = Math.floor(num / 10)) {
            let digit = num % 10;
            sum = sum + digit;
        }

        console.log("Sum of digits:", sum);
    </script>
</body>

</html>
