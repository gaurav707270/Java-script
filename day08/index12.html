<!DOCTYPE html>

<body>
    <script>
        // Write a function that takes an array of numbers and returns the square of each element.
        let array = [45, 7, 84, 98, 25, 14, 156, 56]

        function square() {
            let newArray = [];
            array.forEach((i) => {
                newArray.push(i * i);
            })
            return newArray
        }

        console.log(square(array));
    </script>
</body>
