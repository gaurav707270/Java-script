<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let numbers = [10, 12, 15, 18, 20, 23, 25];
        
        function divisibleByFive(arr) {
            let result = [];

            arr.forEach((num) => {
                if (num % 5 === 0) {
                    result.push(num);
                }
            });

            return result;
        }

        console.log(divisibleByFive(numbers));
    </script>
</body>

</html>
