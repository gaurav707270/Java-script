<body>
    <script>
        //Write a function that takes an array and returns the smallest number in the array.

        let array = [12, 45, 7, 45, 632, 78, 45, 656, 262];


        function findSmallest(array) {
            let smallest = array[0];
            array.forEach((i) => {
                if (i < smallest) {
                    smallest = i;
                }

            })
            return smallest;
        }

        console.log(findSmallest(array))

       
    </script>
</body>
