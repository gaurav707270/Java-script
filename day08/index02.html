<body>
    <script>
        //2. Write a function that takes an array and returns the largest number in the array.

        let array = [12, 45, 7, 45, 632, 78, 45, 656, 262];

        function findLargest(array) {
            let largest = array[0];
            array.forEach((i) => {
                if (i > largest) {
                    largest = i;
                }
            });
            return largest;
        }

        console.log(findLargest(array));
    </script>
</body>
