<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Write a JavaScript program to convert kilometers into meters.


        let kilometers = parseFloat(prompt("Enter the number of kilometers:"));

        let meters = kilometers * 1000;

        alert(kilometers + " kilometers is equal to " + meters + " meters.");
    </script>
</body>

</html>
