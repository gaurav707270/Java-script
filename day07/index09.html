<body>
    <script>
        // Write a JavaScript program to find the remainder when one number is divided by another.

       
        let num1 = 17;
        let num2 = 5;

        
        let remainder = num1 % num2;

        
        console.log("The remainder when " + num1 + " is divided by " + num2 + " is: " + remainder);
    </script>
