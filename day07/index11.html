<body>
    <script>
        //Write a JavaScript program to convert hours into minutes.

        let hours = parseInt(prompt("Enter the number of hours:"));

        let minutes = hours * 60;

        alert(hours + " hours is equal to " + minutes + " minutes.");
    </script>
</body>
