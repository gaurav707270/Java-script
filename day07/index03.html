<body>
    <script>
        //  Write a JavaScript program to convert Celsius temperature to Fahrenheit.

        let celsius = Number(prompt("enter the celsius"))

        let fahrenheit = (celsius * 9 / 5) + 32;

        console.log(celsius + "°Celsius is equal to " + fahrenheit + "°fahrenheit ");
    </script>


</body>
