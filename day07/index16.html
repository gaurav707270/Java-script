<body>
    <script>
        // Write a JavaScript program to find the average of three numbers.


        let num1 = 10;
        let num2 = 20;
        let num3 = 30;


        let average = (num1 + num2 + num3) / 3;


        console.log("The average of " + num1 + ", " + num2 + " and " + num3 + " is: " + average);
    </script>
