<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        // Write a JavaScript program to decrement a number using the decrement operator.

        
        let number = parseInt(prompt("Enter a number:"));

        
        number--;

        
        alert("After decrementing, the number is: " + number);
    </script>
</body>

</html>
