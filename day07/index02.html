<!DOCTYPE html>

<body>
    <script>
        // Write a JavaScript program to swap two numbers without using a third variable.

        let num1 = Number(prompt("enter the value of num1 :"));//50
        let num2 = Number(prompt("enter the value of num2 :"));//100

        console.log("num1 =", num1, "num2 =", num2);


        num1 = num1 + num2;

        num2 = num1 - num2;

        num1 = num1 - num2

        console.log("num1 =", num1, "num2 =", num2);


    </script>
</body>

</html>
