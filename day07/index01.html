<body>

    <script>
        // Write a JavaScript program to swap two numbers using a third variable.

        let num1 = Number(prompt("emnter the value of num1 :"));
        let num2 = Number(prompt("emnter the value of num2 :"));
        console.log("num1 =", num1, "num2 =", num2);

        let num3 = num1;
        num1 = num2;
        num2 = num3;

        console.log("num1 =", num1, "num2 =", num2);
    </script>
</body>
