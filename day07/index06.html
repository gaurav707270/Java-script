<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        //Write a JavaScript program to calculate the area of a circle using the formula πr².

        let circleArea = Number(prompt("enter the value of circleArea :"));

        const area = Math.PI * circleArea * circleArea;



        console.log("The area of a circle =  " + area.toFixed(2));

        
    </script>
</body>
