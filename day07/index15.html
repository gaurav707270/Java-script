<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Write a JavaScript program to convert meters into centimeters.
        
        let meters = parseFloat(prompt("Enter the number of meters:"));

        let centimeters = meters * 100;

        alert(meters + " meters is equal to " + centimeters + " centimeters.");
    </script>
</body>

</html>
