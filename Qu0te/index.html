<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body class="w-100 vh-100 ">

    <a style="width: 100px;" class="btn btn-outline-warning mt-3 float-end mx-5 shadow" type="button"
        href="http://127.0.0.1:5500/Qu0te/favilist.html">
        FaviList</a>

    <div class=" container p-5 text-center h-75 ">
        <h1>Quotes</h1>
        <div id="quote-box"
            class=" h-100 d-flex  justify-content-center align-items-center rounded rounded-3 shadow shadow">

            <div>
                <p class="fs-3 fw-medium text-white p-3" id="quote-text"> </p>
                <p class="fs-5 fw-bold text-white p-3" id="author"></p>
            </div>

        </div>
        <div class="d-flex justify-content-center  ">
            <button style="width: 100px;" class="btn btn-outline-secondary m-5  shadow">Previous</button>
            <button style="width: 100px;" class="btn btn-outline-danger m-5 ri-heart-3-fill shadow">Like</button>

            <button style="width: 100px;" class="btn btn-outline-primary m-5 shadow">Next </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
