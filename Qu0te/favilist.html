<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FaviList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <div class="container">
        <div class="text-center mt-2  sticky-top mt-3 d-flex justify-content-center  ">
            <h1 class="shadow rounded rounded-3 mt-3 p-2 bg-light w-75 border border-4 border-black">
                Your Favourite Quote
            </h1>


        </div>


        <div id="fav-quote-box" class="mt-4"></div>

    </div>
    <script>


        function displayFavorites() {
            const fav_box = document.getElementById("fav-quote-box");


            fav_box.innerHTML = "";

            let storedFav = JSON.parse(localStorage.getItem("favorites")) || [];

            storedFav.forEach((fav) => {
                const div = document.createElement("div");

                div.innerHTML = `
        <div class="mt-3 shadow p-3 rounded rounded-3 ">
            <p class="fs-4 fw-medium">${fav.quote}</p>
            <p class="fs-5 fw-bold">- ${fav.author}</p>
            <button class="btn btn-outline-danger remove-btn">Remove</button>
        </div>`;

                fav_box.appendChild(div);


                div.querySelector(".remove-btn").addEventListener("click", () => {
                    let updated = storedFav.filter(item => item.quote !== fav.quote);
                    localStorage.setItem("favorites", JSON.stringify(updated));

                    displayFavorites();
                });
            });
        }


        displayFavorites();


    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>


</html>
