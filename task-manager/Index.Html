<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {
            border-radius: 15px;
        }

        .task-card:hover {
            transform: scale(1.01);
            transition: 0.3s;
        }

        .badge-high {
            background-color: #dc3545;
        }

        .badge-normal {
            background-color: #ffc107;
            color: black;
        }

        .badge-low {
            background-color: #198754;
        }
    </style>
</head>

<body class="bg-dark">

    <div class="container py-5">

        <h2 class="text-center text-white mb-4">📋 Task Manager</h2>

        <div class="card shadow p-4 mb-4">
            <h5 class="mb-3">Add New Task</h5>

            <form class="row g-3">
                <div class="col-md-6">
                    <input id="input-task-text" type="text" class="form-control" placeholder="Enter Task Title">
                </div>

                <div class="col-md-4">
                    <select id="input-task-priority" class="form-select" aria-label="Default select example">
                        <option selected>Select Task Priority </option>
                        <option value="High">High</option>
                        <option value="Normal">Normal</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button id="task-add-btn" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>

        <div class="card shadow p-4 mb-4">
            <h5 class="mb-3">Search Task</h5>

            <form class="row g-3">
                <div class="col-md-4">
                    <input id="input-search-task" type="text" class="form-control" placeholder="Search by Title">
                </div>

                <div class="col-md-3">
                    <select id="search-task-priority" class="form-select" aria-label="Default select example">
                        <option selected>Select Task Priority </option>
                        <option value="High">High</option>
                        <option value="Normal">Normal</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select id="search-task-status" class="form-select">
                        <option selected>Status</option>
                        <option>Completed</option>
                        <option>Pending</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button id="task-search-btn" class="btn btn-dark w-100">Search</button>
                </div>
            </form>
        </div>

        <div class="card shadow p-4">
            <h5 class="mb-3">Your Tasks</h5>

            <div
                class="task-card d-flex justify-content-between align-items-center p-3 shadow-sm rounded mb-3 bg-light">
                <div>
                    <h6 class="mb-1">Complete React Project</h6>
                    <span class="badge badge-high">High</span>
                    <span class="badge bg-warning text-dark">Pending</span>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm">Undo</button>
                    <button class="btn btn-outline-warning btn-sm">Update</button>
                    <button class="btn btn-outline-danger btn-sm">Delete</button>
                </div>
            </div>

            <div
                class="task-card d-flex justify-content-between align-items-center p-3 shadow-sm rounded mb-3 bg-light">
                <div>
                    <h6 class="mb-1">Study Redux Toolkit</h6>
                    <span class="badge badge-normal">Normal</span>
                    <span class="badge bg-success">Completed</span>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm">Undo</button>
                    <button class="btn btn-outline-warning btn-sm">Update</button>
                    <button class="btn btn-outline-danger btn-sm">Delete</button>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
