<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // wap to print only leap years from to 3000


        let n = Number(prompt("enter the number star with 2000:"));
        let i = 2000;
        while (i <= n) {
            document.writeln(i);
            i = i + 4
        }
    </script>
</body>
