<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <section class=" w-100 vh-100">
        <div class=" d-flex justify-content-center p-3">
            <h1 class="fs-1"> <i class="ri-task-fill"></i> Task Manager</h1>

        </div>

        <div class="d-flex justify-content-center  ">
            <div class="input-group mb-3 w-25   ">
                <input id="input-task" type="text" class="form-control" placeholder="Add Task"
                    aria-label="Recipient’s username" aria-describedby="button-addon2">
                <button id="add-task" class="btn btn-outline-primary" type="button" id="button-addon2">Add</button>
            </div>
        </div>


        <div class="container h-75 shadow rounded rounded-3 overflow-y-auto d-flex justify-content-center">

            <div id="show-task" class="w-100">

            </div>




        </div>



    </section>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
