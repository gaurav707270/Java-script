<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Clock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>


    <div id="container" class="p-5 vh-100 w-100 ">


        <div class=" text-center h-25">
            <h1 class=" "> Digital Clock</h1>
        </div>




        <div class="w-100 d-flex justify-content-center  ">
            <div class=" w-25   bg-white  border border-black rounded rounded-3 bg-black shadow  ">

                <div class=" d-flex w-100 justify-content-evenly p-2 border border-3 border-black rounded-3">

                    <div>
                        <div id="hour" class="text-center fs-2 fw-bold"></div>
                        <p class=" text-center">HOURS</p>
                    </div>

                    <div>
                        <div id="minutes" class="text-center fs-2 fw-bold">47</div>
                        <p class=" text-center">MINUTES</p>
                    </div>

                    <div class="d-flex">
                        <div>
                            <div id="second" class="text-center fs-2 fw-bold">45</div>
                            <p class=" text-center">SECONDS</p>

                        </div>

                    </div>


                    <div class=" d-flex justify-content-center align-items-center">
                        <P id="shift" class=" fs-3"> PM</P>
                    </div>

                </div>

                <div class="border border-3 border-black rounded rounded-3 mt-2">
                    <div>

                        <div>
                            <div id="dt" class=" text-center fs-2 ">

                            </div>
                            <p class=" text-center">Date</p>

                        </div>

                    </div>


                    <div>
                        <div class=" w-100">
                            <div id="day" class="text-center fs-2 fw-bold">FR</div>
                            <p class=" text-center">DAY</p>
                        </div>

                    </div>
                </div>

            </div>



        </div>

    </div>


    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
