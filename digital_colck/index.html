<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Clock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-5 vh-100">


    <div class=" text-center h-25">
        <h1> Digital Clock</h1>
    </div>




    <div class=" w-25  d-flex bg-white justify-content-center ">
        <div class=" w-25">
            <div class="text-center fs-2 fw-bold">FR</div>
            <p class=" text-center">DAY</p>
        </div>

        <div class=" w-25">
            <div class="text-center fs-2 fw-bold">13</div>
            <p class=" text-center">HOURS</p>
        </div>

        <div class=" w-25">
            <div class="text-center fs-2 fw-bold">47</div>
            <p class=" text-center">MINUTES</p>
        </div>

        <div class=" w-25">
            <div class="text-center fs-2 fw-bold">45</div>
            <p class=" text-center">SECONDS</p>
        </div>




    </div>




    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
