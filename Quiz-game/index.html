<body class="bg-black">
    <section class="container vh-100 bg-dark  ">

        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class=" text-white p-5"><i class="ri-game-2-fill text-white"></i> Quiz Game </h1>
            </div>

            <div class="d-flex justify-content-end mx-5 ">
                <p id="timer" style="width: 50px; height: 50px;"
                    class="rounded-circle bg-success text-center align-content-center fs-4 text-white ">1</p>
            </div>
        </div>

        <div id="container" class=" container">
            <div>
                <div style="height: 100px; width: 100%;" class="d-flex">
                    <p style="width: 100px;" class="text-white mx-5 fs-3"> Q -<span id="index"> 1</span></p>
                    <p id="question" class="text-white fs-2 text-center">
                    </p>
                </div>
            </div>


            <div class="d-flex justify-content-center w-100 mt-3">
                <div class=" w-50 text-center" id="options">
                    <div id="option-a" class="d-flex m-1 ">
                        <span style="width: 40px ; height: 40px;"
                            class=" bg-warning  mx-5 rounded-circle align-content-center text-center fs-4">A</span>
                        <p id="a" class=" text-white fs-4  p-1 rounded rounded-3 btn btn-outline-secondary"
                            style="width: 75%;">

                        </p>
                    </div>

                    <div id="option-b" class="d-flex m-1 ">
                        <span style="width: 40px ; height: 40px;"
                            class=" bg-warning  mx-5 rounded-circle align-content-center text-center fs-4">B</span>
                        <p id="b" class=" text-white fs-4  p-1 rounded rounded-3 btn btn-outline-secondary"
                            style="width: 75%;">

                        </p>
                    </div>

                    <div id="option-c" class="d-flex m-1 ">
                        <span style="width: 40px ; height: 40px;"
                            class=" bg-warning  mx-5 rounded-circle align-content-center text-center fs-4">C</span>
                        <p id="c" class=" text-white fs-4  p-1 rounded rounded-3 btn btn-outline-secondary"
                            style="width: 75%;">

                        </p>
                    </div>

                    <div id="option-d" class="d-flex m-1 ">
                        <span style="width: 40px ; height: 40px;"
                            class=" bg-warning  mx-5 rounded-circle align-content-center text-center fs-4">D</span>
                        <p id="d" class=" text-white fs-4  p-1 rounded rounded-3 btn btn-outline-secondary"
                            style="width: 75%;">

                        </p>
                    </div>


                </div>
            </div>

            <div class="mt-3 d-flex justify-content-end w-75">
                <button id="submite" class=" p-2 rounded rounded-3 btn btn-outline-success">
                    NEXT <i class="ri-arrow-right-fill text-black"></i>
                </button>
            </div>




        </div>

        <div id="result" class="text-white text-center">

        </div>



    </section>


    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
