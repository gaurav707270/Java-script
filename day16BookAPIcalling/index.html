<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container my-5">

        <h1 class="text-center mb-4">📚 Find Books</h1>
        <div class="d-flex justify-content-end">
            <a id="cart" style="width: 100px;" class="btn btn-outline-info" href="cart.html">cart</a>
        </div>

        <div class="d-flex justify-content-center mb-4">
            <div class="input-group w-50">
                <input id="searchInput" type="text" class="form-control" placeholder="Search books...">
                <button id="searchBtn" class="btn btn-success">Search</button>
            </div>
        </div>

        <div id="booksContainer" class="row g-3"></div>

    </div>




    <script src="app.js"></script>
</body>

</html>
