<body>
    <script>
        // write the program to check number divisible by 7 or not using if else ?

        let num = Number(prompt("enter the number you want to divided by 7 :"));

        if (num % 7 == 0 ){
            document.writeln("the enter number are divisible by 7 ..")
        }
        else{
            document.writeln("the enter the number are not divisiable by 7 !..")
        }
    </script>
