<body>
    <script>
        // write the progaram to check the number is neutral,negative and positive using ternary operater ..

        let num = Number(prompt("enter the number:"));

        let result = (num > 1) ? "the entered number are positive " :
            (num == 0) ? "the entered number are neutral" :
                (num < 0) ? "the entered number are negative" :
                    "enter the vaid number"

        document.writeln(result);
    </script>
