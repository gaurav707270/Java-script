<body>
    <script>
        // write the program to check user are eligible or not using ternary operator?

        let userAns = prompt("Do you know JavaScript well? answer only yes / no :")

        let result = (userAns === "yes") ? "eligible" : "you are not eligible"

        document.writeln(result);
    </script>
