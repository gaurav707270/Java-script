<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day09</title>
</head>

<body>
    <script>
        // write the program to display month name by count of month ,eg,3 ..

        document.writeln("enter the number to find the count of number of month ..")

        let monthNum = Number(prompt("enter the number 1 to 12 to get month :"));

        switch (monthNum) {
            case 1: document.writeln("January"); break;
            case 2: document.writeln("February"); break;
            case 3: document.writeln("March"); break;
            case 4: document.writeln("April"); break;
            case 5: document.writeln("May"); break;
            case 6: document.writeln("June"); break;
            case 7: document.writeln("July"); break;
            case 8: document.writeln("August"); break;
            case 9: document.writeln("September"); break;
            case 10: document.writeln("October"); break;
            case 11: document.writeln("November"); break;
            case 12: document.writeln("December"); break;
            default: document.writeln("Invalid Month");
        }
    </script>
</body>

</html>
