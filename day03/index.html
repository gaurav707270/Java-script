<body>
    <script>
        let num1 = Number(prompt("enter the frist number :"));

        if (num1 > num2) {
            if (num1 > num3) {
                if (num1 > num4) {

                        document.writeln(`the value of num1 = ${num1} is greastest`);
                    }

                    }
                    else {
